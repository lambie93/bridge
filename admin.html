<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge | Review Suggestions</title>
    <link rel="stylesheet" href="opportunities.css">
</head>
<body>
    <h1>Pending Suggestions</h1>
    <div id="suggestionList"></div>

    <h1>Approved Opportunities</h1>
    <div id="approvedList"></div>

    <script>
        const password = prompt("Enter the admin password:");
        const authHeaders = { "X-Admin-Password": password };
        const API = "https://bridge-okke.onrender.com";

        fetch(API + "/api/suggestions/", { headers: authHeaders })
            .then(response => {
                if (response.status === 401) {
                    throw new Error("Wrong password");
                }
                return response.json();
            })
            .then(suggestions => {
                const list = document.getElementById("suggestionList");

                suggestions.forEach(suggestion => {
                    const card = document.createElement("div");
                    card.innerHTML =
                        "<h3>" + suggestion.opportunity_name + "</h3>" +
                        "<p>" + suggestion.organization + " — " +
                        suggestion.category + "</p>" +
                        '<a href="' + suggestion.official_website + '">Website</a>';
                    list.appendChild(card);

                    const approveBtn = document.createElement("button");
                    approveBtn.textContent = "Approve";
                    approveBtn.addEventListener("click", () => {
                        fetch(API + "/api/suggestions/" + suggestion.id + "/approve",
                            { method: "POST", headers: authHeaders })
                            .then(() => card.remove());
                    });

                    const rejectBtn = document.createElement("button");
                    rejectBtn.textContent = "Reject";
                    rejectBtn.addEventListener("click", ()=> {
                        fetch(API + "/api/suggestions/" + suggestion.id + "/reject",
                            { method: "POST", headers: authHeaders })
                            .then(() => card.remove());
                    });

                    card.appendChild(approveBtn);
                    card.appendChild(rejectBtn);
                });
            })
            .catch(error => {
                document.getElementById("suggestionList").textContent =
                    "Could not load suggestions: " + error.message;
            });

        fetch(API + "/api/opportunities")
            .then(response => response.json())
            .then(opportunities => {
                const list = document.getElementById("approvedList");

                opportunities.forEach(opp => {
                    const card = document.createElement("div");
                    card.innerHTML =
                        "<h3>" + opp.opportunity_name + "</h3>" +
                        "<p>" + opp.organization + " — " +
                        opp.category + "</p>" +
                        '<a href="' + opp.official_website + '">Website</a>';
                    list.appendChild(card);

                    const removeBtn = document.createElement("button");
                    removeBtn.textContent = "Remove";
                    removeBtn.addEventListener("click", () => {
                        fetch(API + "/api/suggestions/" + opp.id,
                            { method: "DELETE", headers: authHeaders })
                            .then(() => card.remove());
                    });

                    card.appendChild(removeBtn);
                });
            });
    </script>
</body>
</html>
