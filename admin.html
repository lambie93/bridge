<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge | Admin</title>

    <link rel="stylesheet" href="opportunities.css">
    <link rel="stylesheet" href="admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>
<body>
    <main class="admin-page">
        <h1>Bridge Admin</h1>

        <form id="passwordForm" class="password-card">
            <label>
                Admin password
                <input type="password" id="passwordInput" required>
            </label>
            <button type="submit" class="btn btn-primary">Log in</button>
            <p id="passwordError" class="form-error"></p>
        </form>

        <div id="adminContent" hidden>
            <h2>Pending Suggestions</h2>
            <div id="suggestionList"></div>

            <h2>Approved Opportunities</h2>
            <div id="approvedList"></div>
        </div>
    </main>

    <script>
        const API = "https://bridge-okke.onrender.com";

        const EDITABLE_FIELDS = [
            ["opportunity_name", "Opportunity Name"],
            ["organization", "Organization"],
            ["official_website", "Website URL"],
            ["category", "Category"],
            ["eligible_grades", "Eligible Grades"],
            ["eligible_ages", "Eligible Ages"],
            ["gender", "Gender"],
            ["cost", "Cost"],
            ["location", "Location"],
            ["time_of_year", "Time of Year"],
            ["season", "Season"],
            ["deadline", "Deadline"]
        ];

        let authHeaders = {};

        const passwordForm = document.getElementById("passwordForm");
        const passwordError = document.getElementById("passwordError");
        const adminContent = document.getElementById("adminContent");

        passwordForm.addEventListener("submit", event => {
            event.preventDefault();

            authHeaders = {
                "X-Admin-Password": document.getElementById("passwordInput").value
            };

            fetch(API + "/api/suggestions", { headers: authHeaders })
                .then(response => {
                    if (response.status === 401) {
                        throw new Error("Wrong password");
                    }
                    return response.json();
                })
                .then(suggestions => {
                    passwordForm.hidden = true;
                    adminContent.hidden = false;
                    renderSuggestions(suggestions);
                    loadApproved();
                })
                .catch(error => {
                    passwordError.textContent = error.message === "Wrong password"
                        ? "Wrong password. Try again."
                        : "Could not reach the server. The backend may be waking up — try again in a minute.";
                });
        });

        // Build one editable card per pending suggestion.
        function renderSuggestions(suggestions) {
            const list = document.getElementById("suggestionList");
            list.innerHTML = "";

            if (suggestions.length === 0) {
                list.innerHTML = '<p class="empty-message">No pending suggestions.</p>';
                return;
            }

            suggestions.forEach(suggestion => {
                const card = document.createElement("div");
                card.className = "admin-card";

                const title = document.createElement("h3");
                title.textContent = suggestion.opportunity_name;
                card.appendChild(title);

                const grid = document.createElement("div");
                grid.className = "edit-grid";

                EDITABLE_FIELDS.forEach(([field, label]) => {
                    const wrapper = document.createElement("label");
                    wrapper.textContent = label;

                    const input = document.createElement("input");
                    input.name = field;
                    input.value = suggestion[field] || "";

                    wrapper.appendChild(input);
                    grid.appendChild(wrapper);
                });

                card.appendChild(grid);

                // Logo upload: preview + file picker.
                let imageData = suggestion.image || "";

                const logoSection = document.createElement("div");
                logoSection.className = "logo-section";

                const logoLabel = document.createElement("span");
                logoLabel.textContent = "Logo image";

                const preview = document.createElement("img");
                preview.className = "logo-preview";
                preview.alt = "Logo preview";
                if (imageData) {
                    preview.src = imageData;
                } else {
                    preview.hidden = true;
                }

                const fileInput = document.createElement("input");
                fileInput.type = "file";
                fileInput.accept = "image/*";
                fileInput.addEventListener("change", () => {
                    const file = fileInput.files[0];
                    if (!file) {
                        return;
                    }
                    resizeImage(file, dataUrl => {
                        imageData = dataUrl;
                        preview.src = dataUrl;
                        preview.hidden = false;
                    });
                });

                logoSection.appendChild(logoLabel);
                logoSection.appendChild(preview);
                logoSection.appendChild(fileInput);
                card.appendChild(logoSection);

                const actions = document.createElement("div");
                actions.className = "card-actions";

                const status = document.createElement("p");
                status.className = "card-status";

                const saveBtn = makeButton("Save Changes", "btn", () => {
                    const updated = {};
                    grid.querySelectorAll("input").forEach(input => {
                        updated[input.name] = input.value;
                    });
                    updated.image = imageData;

                    fetch(API + "/api/suggestions/" + suggestion.id, {
                        method: "PUT",
                        headers: { ...authHeaders, "Content-Type": "application/json" },
                        body: JSON.stringify(updated)
                    }).then(() => {
                        status.textContent = "Saved ✓";
                    });
                });

                const approveBtn = makeButton("Approve", "btn btn-primary", () => {
                    saveBtn.click();
                    fetch(API + "/api/suggestions/" + suggestion.id + "/approve",
                        { method: "POST", headers: authHeaders })
                        .then(() => {
                            card.remove();
                            loadApproved();
                        });
                });

                const rejectBtn = makeButton("Reject", "btn btn-danger", () => {
                    fetch(API + "/api/suggestions/" + suggestion.id + "/reject",
                        { method: "POST", headers: authHeaders })
                        .then(() => card.remove());
                });

                actions.appendChild(saveBtn);
                actions.appendChild(approveBtn);
                actions.appendChild(rejectBtn);
                card.appendChild(actions);
                card.appendChild(status);
                list.appendChild(card);
            });
        }

        // List approved opportunities with a remove button.
        function loadApproved() {
            fetch(API + "/api/opportunities")
                .then(response => response.json())
                .then(opportunities => {
                    const list = document.getElementById("approvedList");
                    list.innerHTML = "";

                    if (opportunities.length === 0) {
                        list.innerHTML =
                            '<p class="empty-message">No approved opportunities yet.</p>';
                        return;
                    }

                    opportunities.forEach(opp => {
                        const card = document.createElement("div");
                        card.className = "admin-card";

                        const title = document.createElement("h3");
                        title.textContent = opp.opportunity_name;

                        if (opp.image) {
                            const logo = document.createElement("img");
                            logo.className = "logo-preview";
                            logo.src = opp.image;
                            logo.alt = opp.opportunity_name + " logo";
                            card.appendChild(logo);
                        }

                        const details = document.createElement("p");
                        details.textContent =
                            (opp.organization || "") + " — " + (opp.category || "");

                        const link = document.createElement("a");
                        link.href = opp.official_website;
                        link.textContent = "Website";
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";

                        const actions = document.createElement("div");
                        actions.className = "card-actions";

                        const removeBtn = makeButton("Remove", "btn btn-danger", () => {
                            fetch(API + "/api/suggestions/" + opp.id,
                                { method: "DELETE", headers: authHeaders })
                                .then(() => card.remove());
                        });

                        actions.appendChild(removeBtn);
                        card.appendChild(title);
                        card.appendChild(details);
                        card.appendChild(link);
                        card.appendChild(actions);
                        list.appendChild(card);
                    });
                });
        }

        // Shrink an uploaded image so it fits nicely in the database,
        // then hand back a data URL that <img src="..."> can use directly.
        function resizeImage(file, done) {
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const maxSize = 400;
                    const scale = Math.min(
                        1, maxSize / Math.max(img.width, img.height)
                    );
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    canvas.getContext("2d").drawImage(
                        img, 0, 0, canvas.width, canvas.height
                    );
                    done(canvas.toDataURL("image/png"));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        }

        function makeButton(text, className, onClick) {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = text;
            button.className = className;
            button.addEventListener("click", onClick);
            return button;
        }
    </script>
</body>
</html>
