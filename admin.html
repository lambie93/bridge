
<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge | Admin</title>

    <link rel="stylesheet" href="opportunities.css">
    <link rel="stylesheet" href="admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <main class="admin-page">
        <h1>Bridge Admin</h1>

        <form id="passwordForm" class="password-card">
            <label>
                Admin Password
                <input type="password" id="passwordInput" required>
            </label>

            <button type="submit" class="btn btn-primary">Log In</button>
            <p id="passwordError" class="form-error"></p>
        </form>

        <div id="adminContent" hidden>
            <h2>Pending Suggestions</h2>
            <div id="suggestionList"></div>

            <h2>Approved Opportunities</h2>
            <div id="approvedList"></div>
        </div>
    </main>

    <script>
        const API = "https://bridge-okke.onrender.com";

        const EDITABLE_FIELDS = [
            ["opportunity_name", "Opportunity Name"],
            ["organization", "Organization"],
            ["official_website", "Website URL"],
            ["category", "Category"],
            ["eligible_grades", "Eligible Grades"],
            ["eligible_ages", "Eligible Ages"],
            ["gender", "Gender"],
            ["cost", "Cost"],
            ["location", "Location"],
            ["time_of_year", "Time of Year"],
            ["season", "Season"],
            ["deadline", "Deadline"]
        ];

        let authHeaders = {};

        const FIELD_OPTIONS = {
            category: [
                "Scholarship", "Internship", "Program",
                "Competition", "Volunteer", "Research", "Hackathon"
            ],
            eligible_grades: [
                "9th Grade", "10th Grade", "11th Grade", "12th Grade",
                "High School Underclassman", "High School Upperclassman",
                "High School", "Incoming College Freshman", "All Grades"
            ],
            eligible_ages: [
                "13", "14", "15", "16", "17", "18", "13-18", "All Ages"
            ],
            gender: ["Both", "Female", "Male"],
            cost: ["Free", "Paid", "Costs Associated"],
            location: ["In-Person", "Virtual", "Hybrid"],
            time_of_year: ["Summer", "School Year"],
            season: ["Winter", "Spring", "Summer", "Fall"]
        };

        const passwordForm = document.getElementById("passwordForm");
        const passwordError = document.getElementById("passwordError");
        const adminContent = document.getElementById("adminContent");

        passwordForm.addEventListener("submit", event => {
            event.preventDefault();

            authHeaders = {
                "X-Admin-Password":
                    document.getElementById("passwordInput").value
            };

            passwordError.textContent = "";

            fetch(API + "/api/suggestions", {
                headers: authHeaders
            })
                .then(response => {
                    if (response.status === 401) {
                        throw new Error("Wrong password");
                    }

                    if (!response.ok) {
                        throw new Error("Server error");
                    }

                    return response.json();
                })
                .then(suggestions => {
                    passwordForm.style.display = "none";

                    adminContent.hidden = false;
                    adminContent.style.display = "block";

                    renderSuggestions(suggestions);
                    loadApproved();
                })
                .catch(error => {
                    passwordError.textContent =
                        error.message === "Wrong password"
                            ? "Wrong password. Try again."
                            : "Could not reach the server. The backend may be waking up — try again in a minute.";
                });
        });

        function renderSuggestions(suggestions) {
            const list = document.getElementById("suggestionList");
            list.innerHTML = "";

            if (suggestions.length === 0) {
                list.innerHTML =
                    '<p class="empty-message">No pending suggestions.</p>';
                return;
            }

            suggestions.forEach(suggestion => {
                const card = document.createElement("div");
                card.className = "admin-card";

                const title = document.createElement("h3");
                title.textContent = suggestion.opportunity_name;
                card.appendChild(title);

                const grid = document.createElement("div");
                grid.className = "edit-grid";

                EDITABLE_FIELDS.forEach(([field, label]) => {
                    const wrapper = document.createElement("label");
                    wrapper.textContent = label;

                    const current = suggestion[field] || "";
                    let input;

                    if (FIELD_OPTIONS[field]) {
                        input = document.createElement("select");

                        const options = FIELD_OPTIONS[field].slice();

                        if (current && !options.includes(current)) {
                            options.unshift(current);
                        }

                        options.forEach(value => {
                            const option = document.createElement("option");
                            option.value = value;
                            option.textContent = value;
                            input.appendChild(option);
                        });

                        input.value = current;
                    } else {
                        input = document.createElement("input");

                        if (field === "deadline") {
                            input.type = "date";
                        }

                        input.value = current;
                    }

                    input.name = field;
                    wrapper.appendChild(input);
                    grid.appendChild(wrapper);
                });

                card.appendChild(grid);

                let imageData = suggestion.image || "";

                const logoSection = document.createElement("div");
                logoSection.className = "logo-section";

                const logoLabel = document.createElement("span");
                logoLabel.textContent = "Logo image";

                const preview = document.createElement("img");
                preview.className = "logo-preview";
                preview.alt = "Logo preview";

                if (imageData) {
                    preview.src = imageData;
                } else {
                    preview.hidden = true;
                }

                const fileInput = document.createElement("input");
                fileInput.type = "file";
                fileInput.accept = "image/*";

                fileInput.addEventListener("change", () => {
                    const file = fileInput.files[0];

                    if (!file) {
                        return;
                    }

                    resizeImage(file, dataUrl => {
                        imageData = dataUrl;
                        preview.src = dataUrl;
                        preview.hidden = false;
                    });
                });

                logoSection.appendChild(logoLabel);
                logoSection.appendChild(preview);
                logoSection.appendChild(fileInput);
                card.appendChild(logoSection);

                const actions = document.createElement("div");
                actions.className = "card-actions";

                const status = document.createElement("p");
                status.className = "card-status";

                const saveBtn = makeButton(
                    "Save Changes",
                    "btn",
                    () => {
                        const updated = {};

                        grid.querySelectorAll("input, select")
                            .forEach(input => {
                                updated[input.name] = input.value;
                            });

                        updated.image = imageData;

                        fetch(API + "/api/suggestions/" + suggestion.id, {
                            method: "PUT",
                            headers: {
                                ...authHeaders,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(updated)
                        })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error("Could not save changes.");
                                }

                                status.textContent = "Saved ✓";
                            })
                            .catch(() => {
                                status.textContent = "Could not save changes.";
                            });
                    }
                );

                const approveBtn = makeButton(
                    "Approve",
                    "btn btn-primary",
                    () => {
                        const updated = {};

                        grid.querySelectorAll("input, select")
                            .forEach(input => {
                                updated[input.name] = input.value;
                            });

                        updated.image = imageData;

                        fetch(API + "/api/suggestions/" + suggestion.id, {
                            method: "PUT",
                            headers: {
                                ...authHeaders,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(updated)
                        })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error("Could not save changes.");
                                }

                                return fetch(
                                    API + "/api/suggestions/" +
                                    suggestion.id + "/approve",
                                    {
                                        method: "POST",
                                        headers: authHeaders
                                    }
                                );
                            })
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error("Could not approve suggestion.");
                                }

                                card.remove();
                                loadApproved();
                            })
                            .catch(() => {
                                status.textContent = "Could not approve suggestion.";
                            });
                    }
                );

                const rejectBtn = makeButton(
                    "Reject",
                    "btn btn-danger",
                    () => {
                        fetch(
                            API + "/api/suggestions/" +
                            suggestion.id + "/reject",
                            {
                                method: "POST",
                                headers: authHeaders
                            }
                        )
                            .then(response => {
                                if (!response.ok) {
                                    throw new Error("Could not reject suggestion.");
                                }

                                card.remove();
                            })
                            .catch(() => {
                                status.textContent = "Could not reject suggestion.";
                            });
                    }
                );

                actions.appendChild(saveBtn);
                actions.appendChild(approveBtn);
                actions.appendChild(rejectBtn);

                card.appendChild(actions);
                card.appendChild(status);

                list.appendChild(card);
            });
        }

        function loadApproved() {
            fetch(API + "/api/opportunities")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Could not load opportunities.");
                    }

                    return response.json();
                })
                .then(opportunities => {
                    const list = document.getElementById("approvedList");
                    list.innerHTML = "";

                    if (opportunities.length === 0) {
                        list.innerHTML =
                            '<p class="empty-message">No approved opportunities yet.</p>';
                        return;
                    }

                    opportunities.forEach(opp => {
                        const card = document.createElement("div");
                        card.className = "admin-card";

                        const title = document.createElement("h3");
                        title.textContent = opp.opportunity_name;

                        if (opp.image) {
                            const logo = document.createElement("img");
                            logo.className = "logo-preview";
                            logo.src = opp.image;
                            logo.alt = opp.opportunity_name + " logo";
                            card.appendChild(logo);
                        }

                        const details = document.createElement("p");
                        details.textContent =
                            (opp.organization || "") +
                            " — " +
                            (opp.category || "");

                        const link = document.createElement("a");
                        link.href = opp.official_website;
                        link.textContent = "Website";
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";

                        const actions = document.createElement("div");
                        actions.className = "card-actions";

                        const removeBtn = makeButton(
                            "Remove",
                            "btn btn-danger",
                            () => {
                                fetch(
                                    API + "/api/suggestions/" + opp.id,
                                    {
                                        method: "DELETE",
                                        headers: authHeaders
                                    }
                                )
                                    .then(response => {
                                        if (!response.ok) {
                                            throw new Error("Could not remove opportunity.");
                                        }

                                        card.remove();
                                    });
                            }
                        );

                        actions.appendChild(removeBtn);

                        card.appendChild(title);
                        card.appendChild(details);
                        card.appendChild(link);
                        card.appendChild(actions);

                        list.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error(error);
                });
        }

        function resizeImage(file, done) {
            const reader = new FileReader();

            reader.onload = () => {
                const img = new Image();

                img.onload = () => {
                    const maxSize = 400;

                    const scale = Math.min(
                        1,
                        maxSize / Math.max(img.width, img.height)
                    );

                    const canvas = document.createElement("canvas");

                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;

                    canvas.getContext("2d").drawImage(
                        img,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    done(canvas.toDataURL("image/png"));
                };

                img.src = reader.result;
            };

            reader.readAsDataURL(file);
        }

        function makeButton(text, className, onClick) {
            const button = document.createElement("button");

            button.type = "button";
            button.textContent = text;
            button.className = className;

            button.addEventListener("click", onClick);

            return button;
        }
    </script>
</body>
</html>
